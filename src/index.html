<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equirectangular 360 — Teaching Environment</title>
  <link rel="stylesheet" href="callouts.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
    #view {
      width: 100%; height: 100%;
      position: relative;
    }
    #fps {
      position: absolute; top: 8px; right: 8px; z-index: 30;
      color: #7a8a9a; font-family: monospace; font-size: 12px;
    }
    #toolbar {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 30; display: flex; gap: 8px;
    }
    #toolbar button {
      background: rgba(10, 14, 20, 0.8); color: #e8eef4;
      border: 1px solid rgba(0, 212, 255, 0.4); border-radius: 6px;
      padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    #toolbar button:hover { background: rgba(0, 212, 255, 0.15); }
  </style>
</head>
<body>
  <div id="view">
    <canvas id="c"></canvas>
    <div id="fps"></div>
    <div id="toolbar">
      <button id="btn-explode">Toggle Exploded View</button>
      <button id="btn-reset">Reset Camera</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
